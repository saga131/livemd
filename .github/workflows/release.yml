name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 提取版本号（tag v0.2.0 → 0.2.0，版本码按 semver 加权）
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          MINOR=$(echo "$V" | cut -d. -f2)
          PATCH=$(echo "$V" | cut -d. -f3)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: 构建 APK
        run: ./gradlew assembleDebug --no-daemon -PappVersionName=${{ steps.ver.outputs.name }} -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: 重命名产物
        run: cp app/build/outputs/apk/debug/app-debug.apk "LiveMD-${{ steps.ver.outputs.name }}.apk"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "LiveMD-${{ steps.ver.outputs.name }}.apk" \
            --title "LiveMD ${{ github.ref_name }}" \
            --generate-notes
