plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.livemd.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.livemd.reader"
        minSdk 26
        targetSdk 34
        // CI 从 git tag 注入（如 v0.2.0 → 0.2.0 / 版本码按 semver 加权）；本地构建默认 0.1.0
        versionCode ((project.findProperty("appVersionCode") ?: "100").toString().toInteger())
        versionName (project.findProperty("appVersionName") ?: "0.1.0")
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // LaTeX 公式渲染（GPL-2.0 + 类路径例外，允许 MIT 应用链接使用；见 ACKNOWLEDGMENTS.md）
    implementation 'ru.noties:jlatexmath-android:0.2.0'
}
